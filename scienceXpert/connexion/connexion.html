<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScienceXpert - Connexion</title>
  <link rel="stylesheet" href="style-connexion.css">
  <meta name="description" content="Page de connexion à la plateforme ScienceXpert.">
  <link rel="icon" href="/scienceXpert/images/icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="login-box">
      <h2>Connexion</h2>
      <form id="loginForm">
        <div class="form-group">
          <h3>Nom d'utilisateur :</h3>
          <input type="text" id="username" name="username" maxlength="20" required="" fdprocessedid="ipf0dh" autocomplete="username">
        </div>

        <div class="form-group">
          <h4>Mot de passe :</h4>
          <div class="password-container">
            <input type="password" id="password" name="password" maxlength="30" required>
            <span class="toggle-password" id="togglePassword">
              <i class="fas fa-eye"></i> <!-- Icône d'œil fermé par défaut -->
            </span>
          </div>
          <button type="button" id="submitBtn">Se connecter</button>
        </div>
        
        <!-- Zone d'erreur -->
        <div id="errorMessage" style="color: red; display: none; margin-bottom: 15px;"></div>

        <div class="form-group">
          <a href="#" class="forgot-password">Mot de passe oublié ?</a>
          <a href="/scienceXpert/connexion/inscription.html" class="subscribe">Pas encore de compte ?</a>
        </div>
      </form>
      <a class="return_ref" href="/scienceXpert/main/index.html">Retour à l'accueil</a>
    </div>
  </div>
  <script src="connexion.js"></script>
</body>

</html>
